<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DARIC.ir | فروش و توسعه قالب سایت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            font-family: 'Vazir', sans-serif;
            color: #eef5ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.8s ease-in;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(18, 26, 34, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid rgba(0, 255, 136, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.2rem;
            border-bottom: 2px solid rgba(0, 255, 136, 0.1);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo img {
            height: 60px;
            border-radius: 12px;
            transition: transform 0.3s;
        }
        .logo img:hover {
            transform: scale(1.05) rotate(-2deg);
        }
        .logo-text {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(to left, #00ff88, #ffdd00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
            100% { text-shadow: 0 0 20px rgba(255, 221, 0, 0.4); }
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .tabs-nav {
            display: flex;
            gap: 1.8rem;
            font-weight: 600;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #c8dae8;
            font-size: 1rem;
            font-family: 'Vazir', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0.5rem 0.2rem;
            position: relative;
            font-weight: 600;
        }
        .tab-btn i {
            color: #ffdd00;
            margin-left: 0.3rem;
            transition: transform 0.5s;
            display: inline-block;
        }
        .tab-btn:hover i {
            transform: rotate(15deg) scale(1.2);
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -5px;
            right: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, #00ff88, #ffdd00);
            transition: width 0.3s;
        }
        .tab-btn:hover {
            color: #ffdd00;
        }
        .tab-btn:hover::after {
            width: 100%;
        }
        .tab-btn.active {
            color: #ffdd00;
        }
        .tab-btn.active::after {
            width: 100%;
        }

        /* سبد خرید */
        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
            color: #c8dae8;
            transition: all 0.3s;
        }
        .cart-icon:hover {
            color: #ffdd00;
            transform: scale(1.1);
        }
        .cart-icon .cart-count {
            position: absolute;
            top: -10px;
            right: -12px;
            background: linear-gradient(135deg, #ff4444, #ff8800);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 0.5s ease;
        }
        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* مودال سبد خرید */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .cart-modal.active {
            display: flex;
        }
        .cart-modal-content {
            background: rgba(18, 26, 34, 0.95);
            border-radius: 2rem;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid rgba(255, 221, 0, 0.3);
            animation: slideUp 0.4s ease-out;
        }
        .cart-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(0, 255, 136, 0.1);
            margin-bottom: 1.5rem;
        }
        .cart-modal-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
        }
        .cart-modal-header h2 span {
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .cart-close {
            background: transparent;
            border: none;
            color: #ff4444;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cart-close:hover {
            transform: rotate(90deg) scale(1.2);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .cart-item-info i {
            font-size: 2rem;
            color: #ffdd00;
        }
        .cart-item-info h4 {
            font-size: 1rem;
            font-weight: 700;
        }
        .cart-item-info p {
            font-size: 0.85rem;
            color: #aac2d6;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .cart-item-actions button {
            background: rgba(255, 221, 0, 0.1);
            border: 1px solid rgba(255, 221, 0, 0.2);
            color: #ffdd00;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Vazir', sans-serif;
        }
        .cart-item-actions button:hover {
            background: rgba(255, 221, 0, 0.3);
            transform: scale(1.1);
        }
        .cart-item-actions .qty {
            font-weight: 700;
            min-width: 30px;
            text-align: center;
            color: #fff;
        }
        .cart-item-actions .price {
            font-weight: 700;
            color: #ffdd00;
            min-width: 80px;
            text-align: left;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem 0;
            color: #aac2d6;
        }
        .cart-empty i {
            font-size: 4rem;
            color: #ffdd00;
            margin-bottom: 1rem;
            display: block;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-top: 2px solid rgba(255, 221, 0, 0.2);
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .cart-total .total-price {
            color: #ffdd00;
            font-size: 1.5rem;
        }
        .checkout-btn {
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            color: #0c0f15;
            font-weight: 800;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
            width: 100%;
        }
        .checkout-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 221, 0, 0.3);
        }

        .tab-content {
            margin-top: 2rem;
        }
        .tab-pane {
            display: none;
            animation: slideUp 0.5s ease-out;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }
        .card {
            background: rgba(22, 34, 46, 0.7);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 1.5rem;
            padding: 1.8rem 1.5rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #ffdd00;
            box-shadow: 0 15px 40px rgba(255, 221, 0, 0.15);
        }
        .card .icon {
            font-size: 3rem;
            color: #ffdd00;
            margin-bottom: 0.8rem;
            display: inline-block;
            transition: transform 0.5s;
        }
        .card:hover .icon {
            transform: rotate(10deg) scale(1.15);
        }
        .card h3 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
        }
        .card p {
            color: #aac2d6;
            font-size: 0.95rem;
        }
        .card .badge {
            display: inline-block;
            margin-top: 0.8rem;
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            color: #0c0f15;
            font-weight: 800;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
        }
        .btn-ghost {
            margin-top: 1rem;
            background: transparent;
            border: 2px solid rgba(255, 221, 0, 0.3);
            color: #e8f0f8;
            padding: 0.4rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-ghost i {
            color: #ffdd00;
            transition: transform 0.5s;
        }
        .btn-ghost:hover i {
            transform: rotate(10deg) scale(1.2);
        }
        .btn-ghost:hover {
            background: rgba(255, 221, 0, 0.15);
            border-color: #ffdd00;
            transform: scale(1.05);
        }
        .btn-add-cart {
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            color: #0c0f15;
            font-weight: 700;
            padding: 0.4rem 1.5rem;
            border-radius: 60px;
            border: none;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }
        .btn-add-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 221, 0, 0.3);
        }

        .hero-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .hero-content {
            flex: 1.2;
            text-align: center;
        }
        .hero-stats {
            flex: 0.8;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            background: rgba(0, 255, 136, 0.04);
            border-radius: 1.5rem;
            padding: 1.8rem;
        }
        .hero-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.2;
            text-align: center;
        }
        .hero-title span {
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .hero-desc {
            color: #b8d0de;
            font-size: 1.1rem;
            border-right: 3px solid #ffdd00;
            padding-right: 1.2rem;
            margin: 1rem auto;
            line-height: 1.8;
            max-width: 600px;
            text-align: center;
        }
        .cta-group {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffdd00, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: block;
            animation: countUp 1.5s ease-out;
        }
        @keyframes countUp {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .stat-label {
            color: #aac2d6;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            color: #0c0f15;
            font-weight: 800;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
        }
        .btn-primary i {
            margin-left: 0.5rem;
            transition: transform 0.5s;
        }
        .btn-primary:hover i {
            transform: rotate(15deg) scale(1.2);
        }
        .btn-primary:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 40px rgba(255, 221, 0, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 221, 0, 0.4);
            color: #e8f0f8;
            font-weight: 700;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s;
        }
        .btn-outline i {
            margin-left: 0.5rem;
            color: #ffdd00;
            transition: transform 0.5s;
        }
        .btn-outline:hover i {
            transform: rotate(15deg) scale(1.2);
        }
        .btn-outline:hover {
            background: rgba(255, 221, 0, 0.15);
            border-color: #ffdd00;
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 221, 0, 0.2);
        }
        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-align: center;
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .section-title span {
            background: linear-gradient(135deg, #00ff88, #ffdd00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .feature-card {
            background: rgba(22, 34, 46, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardFade 0.6s ease-out;
        }
        @keyframes cardFade {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .feature-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #ffdd00;
            box-shadow: 0 15px 40px rgba(255, 221, 0, 0.15);
        }
        .feature-card .feature-icon {
            font-size: 3rem;
            color: #ffdd00;
            margin-bottom: 1rem;
            transition: transform 0.5s;
            display: inline-block;
        }
        .feature-card:hover .feature-icon {
            transform: rotate(10deg) scale(1.1);
        }
        .feature-card h3 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .feature-card p {
            color: #aac2d6;
            font-size: 0.95rem;
        }
        .support-box {
            max-width: 600px;
            margin: 0 auto;
        }
        .support-msg {
            background: rgba(0, 255, 136, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 221, 0, 0.15);
            margin-bottom: 2rem;
        }
        .support-msg i {
            color: #ffdd00;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .support-msg p {
            font-size: 1.1rem;
            color: #b8d0de;
            line-height: 1.8;
        }
        .support-msg p span {
            color: #ffdd00;
            font-weight: 700;
        }
        .support-item {
            background: rgba(22, 34, 46, 0.5);
            border-radius: 1rem;
            padding: 1.5rem;
            border-right: 4px solid #ffdd00;
            margin-bottom: 1rem;
            transition: all 0.3s;
            text-align: center;
        }
        .support-item:hover {
            transform: translateX(-5px);
            background: rgba(22, 34, 46, 0.8);
        }
        .support-item i {
            transition: transform 0.5s;
            font-size: 2rem;
            color: #ffdd00;
            display: block;
            margin-bottom: 0.5rem;
        }
        .support-item:hover i {
            transform: rotate(10deg) scale(1.2);
        }
        .support-item .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffdd00;
            direction: ltr;
            display: inline-block;
        }
        .footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 2px solid rgba(0, 255, 136, 0.1);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            color: #7a96af;
            font-size: 0.95rem;
        }
        .footer-social {
            display: flex;
            gap: 1.5rem;
        }
        .footer-social a {
            color: #b0cada;
            text-decoration: none;
            transition: all 0.3s;
        }
        .footer-social a i {
            color: #ffdd00;
            margin-left: 0.3rem;
            transition: transform 0.5s;
        }
        .footer-social a:hover i {
            transform: rotate(15deg) scale(1.3);
        }
        .footer-social a:hover {
            color: #ffdd00;
            transform: translateY(-3px);
        }
        .dev-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        .dev-stack span {
            background: rgba(0, 255, 136, 0.08);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            font-weight: 700;
            transition: all 0.3s;
        }
        .dev-stack span:hover {
            transform: scale(1.05);
            border-color: #ffdd00;
            box-shadow: 0 0 20px rgba(255, 221, 0, 0.1);
        }
        .dev-stack span i {
            color: #ffdd00;
            margin-left: 0.3rem;
        }

        /* مودال قالب رستوران */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: modalFade 0.5s ease-out;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes modalFade {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-content {
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(18, 26, 34, 0.95);
            border-radius: 2rem;
            padding: 2rem;
            border: 2px solid rgba(255, 221, 0, 0.3);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4444;
            color: #ff4444;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(255, 0, 0, 0.4);
            transform: rotate(90deg) scale(1.1);
        }
        .restaurant-card {
            background: linear-gradient(145deg, #fef3c7 0%, #fde68a 40%, #fca5a5 80%, #f87171 100%);
            border-radius: 48px;
            padding: 2rem 2.2rem;
            border: 1px solid rgba(255, 215, 100, 0.4);
        }
        .restaurant-card .r-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px dashed #eab308;
            padding-bottom: 0.75rem;
            margin-bottom: 2rem;
        }
        .restaurant-card .r-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .restaurant-card .r-brand i {
            font-size: 2.6rem;
            color: #b91c1c;
            filter: drop-shadow(0 4px 8px rgba(200, 50, 0, 0.3));
        }
        .restaurant-card .r-brand h1 {
